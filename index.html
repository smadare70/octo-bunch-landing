<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE OCTO BUNCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Varela+Round&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      linear-gradient(rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.78)),
      url("cover.jpg") center / cover no-repeat fixed #e2e8f0;
    font-family: "Fredoka", "Varela Round", system-ui, sans-serif;
    color: #0a1929;
  }

  main {
    max-width: 640px;
    min-height: 100vh;
    box-sizing: border-box;
    padding: 64px 24px 48px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  h1 {
    margin: 0;
    position: relative;
    z-index: 1;
    overflow: hidden;
    padding: 0.32em 0.95em;
    white-space: nowrap;
    font-size: clamp(20px, 6.2vw, 56px);
    font-weight: 700;
    letter-spacing: 0.06em;
    color: rgba(129, 216, 255, 0.95);
    background-color: #0a1929;
    border-radius: 100px;
    box-shadow:
      inset 0 0.3rem 0.9rem rgba(255, 255, 255, 0.3),
      inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.7),
      inset 0 -0.4rem 0.9rem rgba(64, 180, 255, 0.6),
      0 3rem 3rem rgba(0, 0, 0, 0.3),
      0 1rem 1rem -0.6rem rgba(0, 0, 0, 0.8);
  }

  h1::before,
  h1::after {
    content: "";
    position: absolute;
    pointer-events: none;
  }

  h1::before {
    left: -15%;
    right: -15%;
    bottom: 25%;
    top: -100%;
    border-radius: 50%;
    background-color: rgba(64, 180, 255, 0.15);
  }

  h1::after {
    left: 6%;
    right: 6%;
    top: 12%;
    bottom: 40%;
    border-radius: 22px 22px 0 0;
    box-shadow: inset 0 10px 8px -10px rgba(129, 216, 255, 0.6);
    background: linear-gradient(180deg, rgba(64, 180, 255, 0.25) 0%, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0) 100%);
  }

  h1,
  h1::before,
  h1::after {
    transition: all 0.3s ease;
  }

  h1:hover {
    transform: translateY(-4px);
    box-shadow:
      inset 0 0.3rem 0.5rem rgba(129, 216, 255, 0.4),
      inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.7),
      inset 0 -0.4rem 0.9rem rgba(64, 180, 255, 0.85),
      0 3rem 3rem rgba(0, 0, 0, 0.3),
      0 1rem 1rem -0.6rem rgba(0, 0, 0, 0.8);
  }

  h1:hover::before { transform: translateY(-5%); }
  h1:hover::after { opacity: 0.4; transform: translateY(5%); }

  .tagline {
    margin: 0;
    font-size: 22px;
    font-weight: 500;
  }

  .desc {
    margin: 0;
    font-size: 18px;
    line-height: 1.7;
  }

  .title-wrap {
    position: relative;
    isolation: isolate;
    margin: calc(clamp(56px, 7vw, 84px) * 2.2 - 40px) 0 24px;
  }

  .peek {
    position: absolute;
    z-index: 0;
    bottom: calc(100% - 14px);
    height: clamp(56px, 7vw, 84px);
    width: auto;
    opacity: 0.75;
    transition: transform 0.25s ease, opacity 0.25s ease;
    filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.25));
  }

  .peek:hover {
    opacity: 1;
    transform: translateY(-8px) rotate(-3deg);
  }

  .cta {
    position: fixed;
    left: 24px;
    bottom: 24px;
    isolation: isolate;
  }

  .cta .peek {
    left: 60px;
    height: clamp(64px, 8vw, 92px);
    bottom: calc(100% - clamp(24px, 3.2vw, 36px));
  }

  .pearl-button {
    --white: #e6f3ff;
    --bg: #d6ecff;
    --radius: 100px;
    display: inline-block;
    position: relative;
    z-index: 1;
    text-decoration: none;
    outline: none;
    cursor: pointer;
    border: 0;
    border-radius: var(--radius);
    background-color: var(--bg);
    transition: all 0.2s ease;
    box-shadow:
      inset 0 0.3rem 0.9rem rgba(255, 255, 255, 0.9),
      inset 0 -0.1rem 0.3rem rgba(10, 25, 41, 0.25),
      inset 0 -0.4rem 0.9rem rgba(64, 180, 255, 0.35),
      0 2rem 2rem rgba(0, 0, 0, 0.15),
      0 1rem 1rem -0.6rem rgba(0, 0, 0, 0.4);
  }

  .pearl-button .wrap {
    font-size: 25px;
    font-weight: 600;
    color: #0a1929;
    padding: 32px 45px;
    border-radius: inherit;
    position: relative;
    overflow: hidden;
  }

  .pearl-button .wrap p {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0;
    transition: all 0.2s ease;
    transform: translateY(2%);
    mask-image: linear-gradient(to bottom, rgba(129, 216, 255, 1) 40%, transparent);
  }

  .pearl-button .wrap::before,
  .pearl-button .wrap::after {
    content: "";
    position: absolute;
    transition: all 0.3s ease;
  }

  .pearl-button .wrap::before {
    left: -15%;
    right: -15%;
    bottom: 25%;
    top: -100%;
    border-radius: 50%;
    background-color: rgba(64, 180, 255, 0.15);
  }

  .pearl-button .wrap::after {
    left: 6%;
    right: 6%;
    top: 12%;
    bottom: 40%;
    border-radius: 22px 22px 0 0;
    box-shadow: inset 0 10px 8px -10px rgba(129, 216, 255, 0.6);
    background: linear-gradient(180deg, rgba(64, 180, 255, 0.25) 0%, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0) 100%);
  }

  .pearl-button .wrap p span:nth-child(2) { display: none; }
  .pearl-button:hover .wrap p span:nth-child(1) { display: none; }
  .pearl-button:hover .wrap p span:nth-child(2) { display: inline-block; }

  .pearl-button:hover {
    box-shadow:
      inset 0 0.3rem 0.5rem rgba(255, 255, 255, 0.95),
      inset 0 -0.1rem 0.3rem rgba(10, 25, 41, 0.3),
      inset 0 -0.4rem 0.9rem rgba(64, 180, 255, 0.55),
      0 2rem 2rem rgba(0, 0, 0, 0.15),
      0 1rem 1rem -0.6rem rgba(0, 0, 0, 0.4);
  }

  .pearl-button:hover .wrap::before { transform: translateY(-5%); }
  .pearl-button:hover .wrap::after { opacity: 0.4; transform: translateY(5%); }
  .pearl-button:hover .wrap p { transform: translateY(-4%); }

  .pearl-button:active {
    transform: translateY(4px);
    box-shadow:
      inset 0 0.3rem 0.5rem rgba(255, 255, 255, 0.95),
      inset 0 -0.1rem 0.3rem rgba(10, 25, 41, 0.4),
      inset 0 -0.4rem 0.9rem rgba(64, 180, 255, 0.45),
      0 2rem 2rem rgba(0, 0, 0, 0.15),
      0 1rem 1rem -0.6rem rgba(0, 0, 0, 0.4);
  }

  @media (max-width: 600px) {
    .title-wrap .peek { height: 44px; }
    .title-wrap .peek[src$="char-2.png"],
    .title-wrap .peek[src$="char-5.png"],
    .title-wrap .peek[src$="char-7.png"] { display: none; }
    .title-wrap .peek[src$="char-4.png"] { left: 4% !important; }
    .title-wrap .peek[src$="char-6.png"] { left: 27% !important; }
    .title-wrap .peek[src$="char-3.png"] { left: 54% !important; height: 96px !important; }
    .title-wrap .peek[src$="char-8.png"] { left: 73% !important; }
  }
</style>
</head>
<body>
  <main>
    <div class="title-wrap">
      <img class="peek" src="characters/char-2.png" alt="" style="left: 0%; rotate: -6deg;">
      <img class="peek" src="characters/char-4.png" alt="" style="left: 14%;">
      <img class="peek" src="characters/char-6.png" alt="" style="left: 28%; rotate: 4deg;">
      <img class="peek" src="characters/char-3.png" alt="" style="left: 46%; height: calc(clamp(56px, 7vw, 84px) * 2.2);">
      <img class="peek" src="characters/char-8.png" alt="" style="left: 54%; rotate: -4deg;">
      <img class="peek" src="characters/char-5.png" alt="" style="left: 72%;">
      <img class="peek" src="characters/char-7.png" alt="" style="left: 84%; rotate: 6deg;">
      <h1>THE OCTO BUNCH</h1>
    </div>
    <p class="tagline">סדרת הרפתקאות לילדים</p>
    <p class="desc">
      חבורה ססגונית המונה 8 חברים שנתקלת בכל פרק בתעלומה שמעולל הנבל.
      בכל סוף פרק נענש הנבל בדרך מצחיקה ולא צפויה בעלת מוסר השכל לצופים הקטנים.
    </p>
    <div class="cta">
    <img class="peek" src="characters/char-1.png" alt="">
    <a class="pearl-button" href="https://www.the-octo-bunch.com/site/detail/detail/detailDetail.asp?detail_id=5713964&amp;depart_id=401853" target="_blank" rel="noopener">
      <div class="wrap">
        <p><span>✧</span><span>✦</span>לאתר הסדרה</p>
      </div>
    </a>
    </div>
  </main>
</body>
</html>
